name: Build Source APKs (idempotent)

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Max sources to build this run'
        required: false
        default: '50'
      kind:
        description: 'WEB_SESSION, MCP, or ALL'
        required: false
        default: 'ALL'

permissions:
  contents: write

jobs:
  build-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
            echo "Signing secrets present"
          else
            echo "Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD to repo secrets for signed APKs"
          fi

      - name: Restore + select batch
        env:
          KIND: ${{ github.event.inputs.kind }}
          BATCH: ${{ github.event.inputs.batch_size }}
        run: |
          mkdir -p .factory-state dist
          touch .factory-state/completed.txt
          python3 << 'PY'
          import json, os
          from pathlib import Path
          kind = os.environ.get("KIND", "ALL").upper()
          batch = int(os.environ.get("BATCH", "50"))
          completed = set(Path(".factory-state/completed.txt").read_text().splitlines())
          sources = []
          for part in ["catalog/web.min.json", "catalog/mcp.min.json", "catalog/api.min.json", "catalog/index.min.json"]:
              p = Path(part)
              if p.exists():
                  sources.extend(json.loads(p.read_text()).get("sources", []))
          filtered = []
          seen = set()
          for s in sources:
              sid = s.get("id")
              if not sid or sid in seen or sid in completed:
                  continue
              k = s.get("kind", "").upper()
              if k == "API":
                  continue
              if kind != "ALL" and k != kind and not (kind == "WEB_SESSION" and "WEB" in k):
                  continue
              if k in ("WEB_SESSION", "WEB", "MCP", "HYBRID") or kind == "ALL":
                  seen.add(sid)
                  filtered.append(s)
          batch_list = filtered[:batch]
          Path(".factory-state/batch.json").write_text(json.dumps(batch_list, indent=2))
          print(f"Selected {len(batch_list)} (pool {len(filtered)}, done {len(completed)})")
          PY

      - name: Stamp OmniSource packages
        run: |
          python3 << 'PY'
          import json
          from pathlib import Path
          batch = json.loads(Path(".factory-state/batch.json").read_text())
          out = Path("dist"); out.mkdir(exist_ok=True)
          for s in batch:
              sid = s["id"]
              core = s.get("core") or ("webcore" if "WEB" in s.get("kind","").upper() else "mcpcore")
              pkg = {
                "id": sid,
                "name": s.get("name"),
                "kind": s.get("kind"),
                "core": core,
                "revision": s.get("revision", "1.0.0"),
                "websiteUrl": s.get("websiteUrl", ""),
                "baseUrl": s.get("baseUrl", ""),
                "format": "omnisource-descriptor"
              }
              (out / f"{sid}-1.0.0.omnisource").write_text(json.dumps(pkg, indent=2))
              with open(".factory-state/completed.txt", "a") as f:
                  f.write(sid + "\n")
              print("stamped", sid, core)
          PY

      - name: Commit factory state
        run: |
          git config user.name "omni-factory"
          git config user.email "factory@omnihub.local"
          git add .factory-state dist || true
          git diff --staged --quiet || git commit -m "factory: batch $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true

      - name: Upload batch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnisource-batch
          path: |
            dist/
            .factory-state/completed.txt
